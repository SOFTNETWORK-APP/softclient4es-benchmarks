# SoftClient4ES Arrow Flight SQL vs Trino's Elasticsearch connector.
# Same Elasticsearch index, same host, same session. See METHODOLOGY.md.
#
# Lives in the softclient4es-benchmarks repo. Only `results/` is gitignored (a session that
# backs a published number is committed deliberately -- see .gitignore).
#
# Host sizing: the three engine containers are capped at 4 GB each. Run the full
# matrix with `orchestrate.py --stop-idle-engine` and only two are ever up at once,
# so the Docker VM needs >= 10 GB and >= 12 CPUs. The client process runs on the
# HOST, not in a container, and Trino's S1/S2 fetchall() needs a further
# ~8-15 GB of host RAM -- so >= 32 GB of host memory in total.
services:
  # ── Elasticsearch: a REAL cluster, 3 nodes ──────────────────────────────────
  # Until 2026-08-19 this was one `discovery.type=single-node` container with 4 CPU.
  # That made section 7 prove something narrower than it claimed: five shards read by
  # five Trino splits all landed on ONE 4-CPU Elasticsearch, so "shard parallelism does
  # not close the gap" was really "…while Elasticsearch is the bottleneck", and the
  # measured gains (12% / 9%) sat nowhere near the factor of five that five independent
  # readers would suggest. A reader operating a real cluster could not recognise it.
  #
  # Sizing is bounded by the Docker VM (13 vCPU / 32 GB), and the binding constraint is
  # CPU while BOTH the cluster and an engine are up:
  #     ES 3 x 2 = 6  +  Trino 6  = 12 of 13 vCPU
  #     ES 3 x 2 = 6  +  sidecar 4 = 10 of 13
  # Per-node heap stays at today's 2 GB so the change is topology, not heap pressure.
  # Total ES CPU does rise 4 -> 6; that helps BOTH engines and the raw-scroll floors
  # equally, and no arrangement inside the old 10 vCPU could add nodes without either
  # oversubscribing the VM or shrinking Trino's 1.5x handicap.
  elasticsearch: &es
    image: elasticsearch:8.18.3            # same image string the arrow repo's CI uses
    environment: &es-env
      - node.name=es-1
      - cluster.name=docker-cluster
      # Every node is master-eligible AND a data node: 3 nodes, quorum of 2, which is
      # the smallest configuration that is a real cluster rather than a single node
      # wearing three hats.
      - discovery.seed_hosts=elasticsearch,elasticsearch-2,elasticsearch-3
      - cluster.initial_master_nodes=es-1,es-2,es-3
      - xpack.security.enabled=false       # both stacks run auth-less: identical (zero) auth cost
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports: ["9200:9200"]
    # Named volume, added 2026-08-07. Previously the index lived in the container's
    # writable layer, so `docker compose down` silently destroyed the 10M-row corpus and
    # the next session would regenerate it -- a slow, easy-to-miss reset in the middle of
    # a multi-hour matrix. Generation is the expensive step; keep it outside the container
    # lifecycle. Reset deliberately with `docker compose down -v`.
    #
    # ⚠️ ONE VOLUME PER NODE. Sharing esdata across three nodes would corrupt the data
    # path -- each node needs its own.
    volumes:
      - esdata:/usr/share/elasticsearch/data
    mem_limit: 4g
    cpus: 2
    healthcheck:
      # A node answering /_cluster/health is not a formed cluster: it answers while the
      # others are still joining, and an index created in that window gets allocated on
      # whatever has registered so far. Wait for 3 nodes, exactly as the Trino readiness
      # check waits for 2 workers.
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_nodes=3&wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60

  elasticsearch-2:
    <<: *es
    environment:
      - node.name=es-2
      - cluster.name=docker-cluster
      - discovery.seed_hosts=elasticsearch,elasticsearch-2,elasticsearch-3
      - cluster.initial_master_nodes=es-1,es-2,es-3
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports: []
    volumes:
      - esdata2:/usr/share/elasticsearch/data

  elasticsearch-3:
    <<: *es
    environment:
      - node.name=es-3
      - cluster.name=docker-cluster
      - discovery.seed_hosts=elasticsearch,elasticsearch-2,elasticsearch-3
      - cluster.initial_master_nodes=es-1,es-2,es-3
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports: []
    volumes:
      - esdata3:/usr/share/elasticsearch/data

  flight-sql:
    # The measured build; override with SIDECAR_TAG in .env to measure a different image.
    # Each session records the resolved image digest in results/<session>/sidecar-image.txt.
    #
    # ⚠️ 0.2.5 vs 0.2.5.1 is NOT a cosmetic bump for this benchmark. On 0.2.5 the Flight
    # schema probe re-ran the user's whole statement whenever it already carried a LIMIT
    # (arrow#163), so every bounded extraction read its rows off Elasticsearch TWICE.
    # S1m is the cell that moves; do not blend figures across the two tags.
    #
    # ⚠️ 0.2.5.1 vs 0.3.0 is a bigger break than that, in BOTH directions:
    #   * core 0.21.0 carries #238 -- a no-ORDER-BY/no-LIMIT extraction now pages
    #     Elasticsearch with min(primary shards, max-slices) CONCURRENT PIT slices
    #     instead of one sequential reader. S1/S2 are the cells that move, and on a
    #     multi-shard index they move a lot. Row ORDER of an un-ordered extraction now
    #     interleaves across slices; nothing in this harness depends on it.
    #   * extensions 0.3.0 carries #57 -- SOFTCLIENT4ES_LICENSE_PUBLIC_KEY is IGNORED and
    #     licences verify against the trust root built into the artifact. A self-minted
    #     benchmark licence therefore degrades to Community (maxQueryResults 10,000) and
    #     every >=1M-row cell aborts on the row-count assert. The Enterprise licence must
    #     now be issued by the licence server. See .env.example.
    # Do not blend figures across 0.2.5.1 and 0.3.0.
    image: softnetwork/softclient4es8-arrow-flight-sql:${SIDECAR_TAG:-0.3.0}
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_HOST=elasticsearch
      - ELASTIC_PORT=9200
      # Heap pinned to match Elasticsearch's explicit 2 GB. Without this the JVM's
      # default MaxRAMPercentage (25%) would give the sidecar only ~1 GB of the 4 GB
      # container while Trino's image default takes ~80% -- an accidental asymmetry.
      #
      # This MUST go through JAVA_OPTS, never JAVA_TOOL_OPTIONS: the image bakes the
      # Arrow allocator's required --add-opens (including
      # java.base/java.nio=org.apache.arrow.memory.core) into JAVA_TOOL_OPTIONS, and
      # setting that variable here would REPLACE them and break startup. The
      # sbt-native-packager launcher appends JAVA_OPTS (verified in the image at
      # /opt/docker/bin/softclient4es8-arrow-flight-sql).
      #
      # NO -Dlogback.configurationFile, and no mounted logback.xml, since arrow#138 (FIXED,
      # closed 2026-08-07). The image now ships a logback.xml inside the server jar that
      # already reads SOFTCLIENT4ES_LOG_LEVEL and already pins the wire loggers at WARN
      # independently of the root level. Overriding it bought nothing and cost a session:
      # the file we used to mount hardcoded <root level="INFO">, which silently won over
      # the environment variable and made a whole "warnlog" run a mislabelled INFO run.
      #
      # The sidecar is now "as shipped, plus one documented environment variable", which is
      # a stronger fairness position than configuring it ourselves.
      - JAVA_OPTS=-Xms2g -Xmx2g
      # MANDATORY for a valid measurement -- log volume must be comparable between the
      # two engines, and at INFO it is not. Measured over one full matrix session:
      #
      #   Trino          10,265 lines, of which ONE per query
      #                  ("QueryMonitor TIMELINE: ... FINISHED :: elapsed 26446ms");
      #                  the bulk is a one-time startup config dump.
      #   SoftClient4ES  26,933 lines, including 21,210 "Scroll progress: N docs,
      #                  N batches, N docs/sec" -- about 731 PER 10M-row extraction,
      #                  emitted from the akka dispatcher thread doing the extraction.
      #
      # Trino's logging is O(queries); ours is O(rows / batch). Nominally identical
      # levels are therefore NOT comparable behaviour, and the gap widens with data
      # size. WARN removes the per-batch progress chatter and leaves both engines
      # logging only what they emit per query.
      #
      # This is disclosed, not hidden: RESULTS section 1 records it, and the earlier
      # INFO-level sessions are retained for comparison. The wire loggers are pinned at
      # WARN independently of this value (see sidecar/logback.xml), so no level set here
      # can expose document payloads.
      #
      # THIS VARIABLE WAS INERT UNTIL 2026-08-10. sidecar/logback.xml is mounted OVER the
      # image's config and hardcoded <root level="INFO">, which silently won. The session
      # labelled "warnlog" (results/20260809T085738) therefore ran at INFO, and its
      # "WARN is performance-neutral" reading was unfounded -- both sessions were INFO,
      # so of course they matched. Corrected in RESULTS section 1. After ANY change here,
      # verify the level actually took effect:
      #   docker logs <sidecar> | grep -oE '\b(DEBUG|INFO|WARN|ERROR)\b' | sort | uniq -c
      #
      # Parametrised so the INFO-vs-WARN question can actually be MEASURED rather than
      # asserted -- that is the whole lesson of the correction above. WARN remains the
      # default, so a normal run is still a WARN run:
      #   SOFTCLIENT4ES_LOG_LEVEL=INFO docker compose up -d --force-recreate flight-sql
      - SOFTCLIENT4ES_LOG_LEVEL=${SOFTCLIENT4ES_LOG_LEVEL:-WARN}
      # Defensive raise only. The 120s default bounds schema-probe / materialize awaits
      # and PER-BATCH stream pulls -- it is NOT a total-extraction cap, so it would not
      # have aborted a 10M-row stream anyway. METHODOLOGY must not claim otherwise.
      - ARROW_QUERY_TIMEOUT_SECONDS=1800
      # --- JOIN memory model (arrow#141, fixed in 0.2.5-SNAPSHOT) ---------------------
      # Three DIFFERENT resources, three knobs. They must never be summed into one
      # "effective cap": DuckDB already composes memory+spill by itself, and inflating
      # its RAM limit by the disk budget stops it spilling until the container is dead.
      #
      # 1. DuckDB's native RAM ceiling. SPILLABLE -- it overflows to spill-dir.
      - ARROW_JOIN_MAX_MEMORY=512m
      # 2. The Arrow extraction budget for the JOIN legs, shared equally between them.
      #    JVM memory, UN-spillable: no temp directory can rescue it, so this is the
      #    ceiling that actually bounds how big a JOIN can be. Left unset it falls back
      #    to max-memory (256m => 128 MB per leg on a 2-table join), which is far too
      #    small for benchmark-scale legs.
      - ARROW_JOIN_MAX_EXTRACTION_MEMORY=1g
      # 3. Where DuckDB spills, and how much it may write. Verified disk-backed here:
      #    /tmp is `overlay` in this image, NOT tmpfs -- on tmpfs or a k8s emptyDir with
      #    medium=Memory, spilling would consume RAM and this setting would be a trap.
      #    Bounded deliberately: the built-in default is 25% of the volume, and DuckDB's
      #    own default would be 90% of available disk -- enough to fill the host.
      - ARROW_JOIN_SPILL_DIR=/tmp/softclient4es/duckdb-spill
      - ARROW_JOIN_MAX_SPILL_SIZE=4g
      # ARROW_MAX_MEMORY (root allocator limit, arrow#146) is deliberately NOT set.
      # Every session so far ran with the allocator unlimited; introducing a ceiling at
      # the same time as a new build would confound the extraction comparison with a new
      # failure mode. The cost is that /health/ready cannot evaluate allocator headroom
      # -- liveness, which is what wait_healthy needs, is unaffected. Set it when the
      # question is "how does the sidecar behave under a memory ceiling", not before.
      # Page size. The DEFAULT is unchanged (1000 == Trino's elasticsearch.scroll-size),
      # but it is now written out rather than inherited silently, for two reasons: the
      # fairness rule in METHODOLOGY section 2 is about a value a reader can check, and
      # the tuned sensitivity arm (added 2026-08-16, after a reviewer observed that equal
      # NUMBERS are not equal EFFECTS -- 1000 makes Trino do 10,000 scroll round trips
      # for a 10M-row scan) needs both sides tunable to stay symmetric:
      #
      #   ARROW_BATCH_SIZE=5000 docker compose up -d flight-sql   # our tuned arm
      #   run_trino.py --catalog elasticsearch_tuned              # their tuned arm
      #
      # Values above 4,032 work (arrow#143's non-growing-vector cap is fixed): 9,000
      # rows came back in 2 batches at ARROW_BATCH_SIZE=5000. ⚠️ That check was run at
      # bring-up on 0.2.5 and has NOT been repeated on the published 0.2.5.1 image --
      # no tuned-sidecar arm exists in the current session, whose only tuned arm is
      # Trino's. The fix is present in both images, so the statement holds; it is
      # attributed to the build that actually measured it rather than upgraded to the
      # published one. Without that fix the tuned arm could only have tuned Trino, so
      # this is what makes the symmetric comparison possible at all.
      - ARROW_BATCH_SIZE=${ARROW_BATCH_SIZE:-1000}
      #
      # --- Elasticsearch paging (core #238, new in 0.21.0) ---------------------------
      # TWO DIFFERENT page sizes exist and they are not interchangeable. ARROW_BATCH_SIZE
      # above is how many rows the sidecar puts in one Arrow batch on the wire TO THE
      # CLIENT. ELASTIC_SCROLL_SIZE is how many documents one page reads FROM
      # ELASTICSEARCH -- that is the one whose peer is Trino's elasticsearch.scroll-size,
      # and the fairness rule in METHODOLOGY section 2 is about THIS value. Both default
      # to 1000, which is also Trino's default, so the default arm stays symmetric.
      - ELASTIC_SCROLL_SIZE=${ELASTIC_SCROLL_SIZE:-1000}
      #
      # Concurrent PIT slices for a no-ORDER-BY/no-LIMIT extraction (ES 7.15+). The
      # EFFECTIVE count is min(primary shards, max-slices), so on the 6-shard main index
      # the shipped default 8 resolves to 6 -- verified in the sidecar log:
      #   "Sliced PIT paging: 6 slices over 6 primary shards (max-slices 8, page 1000)"
      #
      # Left at the shipped default deliberately: the headline arm must be the software
      # as a user receives it, not a tuned configuration. Setting 1 restores the
      # sequential reader that every session up to and including 0.2.5.1 measured, which
      # is what makes an honest A/B of #238 possible on identical hardware:
      #
      #   ELASTIC_SCROLL_MAX_SLICES=1 docker compose up -d --force-recreate flight-sql
      #
      # ⚠️ Verify the value took effect rather than trusting it -- the same lesson as
      # SOFTCLIENT4ES_LOG_LEVEL above, which was inert for a whole session. Grep the
      # SLICE COUNT the extraction reports, NOT the decision message: at max-slices = 1
      # the sidecar skips the shard-count lookup and logs no decision at all, so a grep
      # for "Sliced PIT paging|paging sequentially" comes back empty on a perfectly
      # well-configured sequential run.
      #   docker logs <sidecar> | grep -E "slice\(s\)|Sliced PIT paging"
      #   -> "PIT search_after completed (6 slice(s))"  sliced
      #   -> "PIT search_after completed (1 slice(s))"  sequential
      # Needs SOFTCLIENT4ES_LOG_LEVEL=INFO; both lines are INFO.
      - ELASTIC_SCROLL_MAX_SLICES=${ELASTIC_SCROLL_MAX_SLICES:-8}
      #
      # NO licence env is wired here on purpose: as committed, this service runs on
      # Community (10k maxQueryResults), which rehearses every scenario end to end at
      # --limit scale. Full 10M S1/S2 runs need an Enterprise licence, injected LOCALLY
      # and only locally via a gitignored docker-compose.override.yml -- see the internal
      # benchmark runbook. Nothing about licence provisioning belongs in this file.
    # No volumes. The logback.xml mount was removed with arrow#138's fix; see JAVA_OPTS above.
    #
    # 32011 is the health endpoint (arrow#146). Published so the JSON body -- allocator
    # stats, fatal-error latch, per-check results -- can be read from the host while a
    # measurement is in flight:  curl -s localhost:32011/health | jq
    ports: ["32010:32010", "32011:32011"]
    mem_limit: 4g
    cpus: 4
    # NO healthcheck override, as of arrow#146. The image now ships a real probe:
    #   GET /health, asserted 200, over bash /dev/tcp (the JRE image has no curl).
    # What we had here before was a TCP connect to the Flight port, which reports
    # healthy for a process that has latched a fatal error and can no longer serve --
    # the blindness #146 was filed about. Overriding it would reintroduce exactly that,
    # so this follows the same rule already applied to Trino: when the image ships a
    # real probe, use it.
    #
    # The image polls on a 30s interval with a 30s start_period, so wait_healthy can take
    # longer to observe readiness than the 5s probe it replaces (observed in practice:
    # healthy within seconds of start). Accepted either way against a multi-hour matrix:
    # a slower wait on a probe that means something beats a fast one that does not.
    #
    # Liveness only. Readiness (/health/ready) additionally checks allocator headroom,
    # but only when ARROW_MAX_MEMORY gives the root allocator a real limit -- deliberately
    # left unset here, see below.

  # ── Trino: a real 3-node cluster (1 coordinator + 2 workers) ────────────────
  #
  # The published single-shard figures were taken against ONE Trino container
  # (4 CPU / 4 GB, coordinator and worker in the same JVM). That configuration
  # answers "who runs Trino on a single node?" with "nobody", so the multi-shard
  # sensitivity run uses a dedicated coordinator plus two workers -- the shape a
  # small production cluster actually has.
  #
  # RESOURCES, and they are NOT at parity -- state this wherever the figures appear:
  #   Trino  6 CPU / 8 GB total   (coordinator 2/2, workers 2/3 each)
  #   sidecar 4 CPU / 4 GB
  # Trino deliberately gets 1.5x the CPU and 2x the memory. A wall-clock gain is
  # therefore not attributable to split parallelism alone, and we say so rather
  # than let a reader assume parity.
  #
  # ⚠️ ES 4 + Trino 6 = 10 of the VM's 10 vCPUs, where the sidecar leaves 2 spare.
  # That asymmetry runs AGAINST Trino. Check `docker stats` for throttling on a
  # pilot run before measuring; if it appears, drop the coordinator to 1 CPU.
  #
  # `trino` stays the coordinator's service name so the client endpoint, the README
  # commands and orchestrate.py's ENGINE_OF entry keep working. It depends_on the
  # workers purely so `docker compose up -d trino` still brings the whole cluster up;
  # workers retry discovery until the coordinator answers, so start order is free.
  trino:
    image: trinodb/trino:483
    depends_on:
      elasticsearch:
        condition: service_healthy
      trino-worker-1:
        condition: service_started
      trino-worker-2:
        condition: service_started
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/coordinator/config.properties:/etc/trino/config.properties:ro
    ports: ["8080:8080"]
    mem_limit: 2g
    cpus: 2
    # Trino keeps its image-default heap policy (Initial/MaxRAMPercentage=80) on every
    # node -- MORE heap per node than either other engine gets. That asymmetry runs in
    # Trino's favour and is deliberately left in place; RESULTS records the computed
    # value.
    #
    # NO healthcheck override. The official image ships its own:
    #   HEALTHCHECK --interval=10s --timeout=5s --start-period=10s \
    #     CMD /usr/lib/trino/bin/health-check
    # (verified on trinodb/trino master, core/docker/Dockerfile). Its hardened base
    # may lack curl, so do NOT replace it with a curl probe. Watch readiness with
    # `docker compose ps` (healthy), or from the HOST:
    #   curl -sf http://localhost:8080/v1/info   -> "starting":false
    #
    # A HEALTHY COORDINATOR IS NOT A READY CLUSTER. It answers before the workers
    # have registered, and a query issued in that window runs on fewer nodes than
    # the run claims. orchestrate.py polls /v1/node for the expected worker count.

  trino-worker-1: &trino-worker
    image: trinodb/trino:483
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/worker/config.properties:/etc/trino/config.properties:ro
    mem_limit: 3g
    cpus: 2

  trino-worker-2:
    <<: *trino-worker

# Persists the generated corpus across container recreation. Deliberate reset:
#   docker compose down -v
volumes:
  # One data path per node -- sharing a volume across three Elasticsearch nodes
  # corrupts the data directory rather than clustering them.
  esdata:
  esdata2:
  esdata3:
