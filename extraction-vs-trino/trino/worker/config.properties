# Trino worker — shared by trino-worker-1 and trino-worker-2 (same file, same config).
#
# node.properties is left as the image ships it, so every node reports the same
# node.environment and Trino generates a distinct node.id per container. Overriding
# it here would give both workers the SAME id and the cluster would see one node.
#
# Workers retry discovery until the coordinator answers, so container start order
# does not matter.
coordinator=false
http-server.http.port=8080
discovery.uri=http://trino:8080
