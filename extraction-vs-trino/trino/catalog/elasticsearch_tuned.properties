# The TUNED sensitivity arm, added 2026-08-16.
#
# Identical to elasticsearch.properties except for the page size. It exists because
# "page-size symmetry" as published (both sides at their default 1000) is symmetry of
# NUMBER, not of EFFECT: at 1000, a 10-million-row scan costs Trino 10,000 scroll round
# trips, which is plausibly a poor default rather than a fair setting. Defaults-vs-defaults
# is a defensible choice, but only if the alternative was measured instead of assumed.
#
# A SECOND CATALOG rather than an edit: both page sizes are then live at the same time,
# selected per query by the client (`run_trino.py --catalog elasticsearch_tuned`), so the
# tuned arm needs no restart, cannot silently contaminate the headline arm, and both
# configurations are recorded in the session directory.
#
# The symmetric counterpart on our side is ARROW_BATCH_SIZE=5000 (see docker-compose.yml).
# Publish both directions: tuned-Trino against our default is the conservative reading,
# tuned-against-tuned is the fair one.
connector.name=elasticsearch
elasticsearch.host=elasticsearch
elasticsearch.port=9200
elasticsearch.default-schema-name=default
elasticsearch.scroll-size=5000
elasticsearch.scroll-timeout=5m
elasticsearch.request-timeout=2m
