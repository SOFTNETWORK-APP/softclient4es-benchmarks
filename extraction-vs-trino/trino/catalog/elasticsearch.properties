connector.name=elasticsearch
elasticsearch.host=elasticsearch
elasticsearch.port=9200
elasticsearch.default-schema-name=default
# Page size pinned equal to the sidecar's ARROW_BATCH_SIZE (1000). Both values are the
# respective defaults; both are written out explicitly so METHODOLOGY can point at them.
elasticsearch.scroll-size=1000
# Defaults (1m / 10s) are tight for a 10M-doc scan. Raised on this side only because the
# scan is long, not to change throughput -- see METHODOLOGY section 2.
elasticsearch.scroll-timeout=5m
elasticsearch.request-timeout=2m
