# Trino coordinator — multi-node topology for the multi-shard sensitivity run.
#
# node-scheduler.include-coordinator=false is the deliberate choice: it is what a
# real deployment does, and it is what makes this a genuine 3-node cluster rather
# than a single node with two helpers. Splits therefore run on the two workers only
# (2 x 2 CPU), while the coordinator keeps its 2 CPU for planning and for serving
# result pages to the client — which is on the critical path of every wall-clock
# figure this benchmark reports.
#
# The discovery service is embedded in the coordinator; `trino` is this service's
# name in docker-compose.yml, so the workers' discovery.uri points at it.
coordinator=true
node-scheduler.include-coordinator=false
http-server.http.port=8080
discovery.uri=http://trino:8080
